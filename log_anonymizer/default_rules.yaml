# Règles par défaut. L'ordre compte : elles sont appliquées de haut en bas.
# Un groupe nommé (?P<value>...) limite le masquage à cette partie.

sensitive_keys:   # clés JSON dont la valeur est masquée en entier (liste ou dict clé -> label)
  - password
  - passwd
  - pwd
  - secret
  - token
  - access_token
  - refresh_token
  - api_key
  - apikey
  - authorization
  - user: USER
  - username: USER
  - login: USER

rules:
  - name: secret_kv
    label: SECRET
    flags: [IGNORECASE]
    # password=xxx, token: xxx, "api_key": "xxx"
    pattern: '(?:\b|")(?:password|passwd|pwd|secret|token|access_token|refresh_token|api[_-]?key|apikey)"?\s*[=:]\s*"?(?P<value>[^\s",;&}]+)'

  - name: bearer
    label: SECRET
    flags: [IGNORECASE]
    pattern: '\b(?:Bearer|Basic)\s+(?P<value>[A-Za-z0-9._~+/=-]{8,})'

  - name: email
    label: EMAIL
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'

  - name: username
    label: USER
    flags: [IGNORECASE]
    # user=bob, username: bob, login=bob, "user": "bob", for user bob, Failed password for bob
    pattern: '(?:\b(?:user(?:name)?|login|uid)"?\s*[=:]\s*"?|\b(?:for(?: invalid)? user|password for|by user)\s+)(?P<value>(?!<)[A-Za-z0-9._-]+)'

  - name: mac
    label: MAC
    pattern: '\b[0-9A-Fa-f]{2}(?:([:-])[0-9A-Fa-f]{2})(?:\1[0-9A-Fa-f]{2}){4}\b'

  - name: ipv6
    label: IPV6
    pattern: '(?<![:\w])(?:(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:|(?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}|(?:[0-9A-Fa-f]{1,4}:){1,4}(?::[0-9A-Fa-f]{1,4}){1,3}|(?:[0-9A-Fa-f]{1,4}:){1,3}(?::[0-9A-Fa-f]{1,4}){1,4}|(?:[0-9A-Fa-f]{1,4}:){1,2}(?::[0-9A-Fa-f]{1,4}){1,5}|[0-9A-Fa-f]{1,4}:(?::[0-9A-Fa-f]{1,4}){1,6}|::(?:[0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4}|::)(?![:\w])'

  - name: phone_fr
    label: PHONE
    # 06 12 34 56 78, 06.12.34.56.78, 0612345678, +33 6 12 34 56 78, 0033612345678
    pattern: '(?<![\d+])(?:(?:\+|00)33\s?[1-9]|0[1-9])(?:[\s.-]?\d{2}){4}(?!\d)'

  - name: ipv4
    label: IPV4
    pattern: '\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'

